name: Scrape Arab News

on:
  workflow_dispatch:
    inputs:
      save_artifacts:
        description: "Upload page HTML/screenshots even when scraping succeeds"
        required: false
        default: "false"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RETENTION_DAYS: "3"

jobs:
  scrape:
    runs-on: [self-hosted, linux, x64, kc-sand, arabnews-fixed-ip]
    timeout-minutes: 20

    steps:
      - name: Runner bootstrap diagnostics
        run: |
          echo "::group::Runner bootstrap"
          echo "Timestamp: $(date -Iseconds)"
          echo "Runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          uname -a
          uptime || true
          free -h || true
          df -h "${GITHUB_WORKSPACE}" /tmp || true
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prune old rendered clips
        run: npm run prune:retention
        env:
          TIME_ZONE: Asia/Riyadh

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: Scrape
        id: scrape
        run: |
          for attempt in 1 2 3; do
            echo "::group::Scrape attempt ${attempt}/3"
            echo "Started at: $(date -Iseconds)"
            if npm run scrape; then
              status=0
            else
              status=$?
            fi
            echo "Finished at: $(date -Iseconds)"
            echo "Exit code: ${status}"
            echo "::endgroup::"
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            echo "Scrape attempt ${attempt} failed with exit code ${status}."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 45))
            fi
          done
          exit "${status}"
        env:
          TIME_ZONE: Asia/Riyadh
          VIDEO_LIMIT: "3"
          EXTRA_WAIT_MS: "8000"
          ARCHIVE_ITEMS: "true"
          SAVE_ARTICLE_HTML: "false"
          SAVE_VIDEO_FILES: "true"
          FFMPEG_PATH: /usr/bin/ffmpeg
          MAX_VIDEO_BYTES: "95000000"
          RECENT24H_ENABLED: "true"
          RECENT24H_REQUIRE_ITEMS: "false"
          RECENT24H_CANDIDATE_LIMIT: "220"
          RECENT24H_LISTING_PAGES: "2"
          RECENT24H_REQUEST_DELAY_MS: "250"
          SAVE_PAGE_ARTIFACTS: ${{ inputs.save_artifacts || 'false' }}
          PLAYWRIGHT_PROXY_SERVER: ${{ secrets.PLAYWRIGHT_PROXY_SERVER }}
          PLAYWRIGHT_PROXY_USERNAME: ${{ secrets.PLAYWRIGHT_PROXY_USERNAME }}
          PLAYWRIGHT_PROXY_PASSWORD: ${{ secrets.PLAYWRIGHT_PROXY_PASSWORD }}

      - name: Commit scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.md data/recent-24h.json data/recent-24h.md archive/latest rendered-clips
          if git diff --cached --quiet; then
            echo "No scraped data changes."
          else
            git commit -m "Update Arab News scrape"
            git push
          fi

      - name: Write runner diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "# Runner diagnostics"
            echo "Generated: $(date -Iseconds)"
            echo
            echo "## Runner"
            echo "Name: ${RUNNER_NAME:-unknown}"
            echo "OS: ${RUNNER_OS:-unknown}"
            echo "Arch: ${RUNNER_ARCH:-unknown}"
            echo "Workspace: ${GITHUB_WORKSPACE}"
            echo
            echo "## System"
            uname -a || true
            uptime || true
            free -h || true
            echo
            echo "## Disk"
            df -h "${GITHUB_WORKSPACE}" /tmp || true
            echo
            echo "## Workspace size"
            du -sh "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/node_modules" "${GITHUB_WORKSPACE}/artifacts" "${GITHUB_WORKSPACE}/rendered-clips" 2>/dev/null || true
            echo
            echo "## Git"
            git status --short || true
            git log -1 --oneline || true
            echo
            echo "## Tool versions"
            node --version || true
            npm --version || true
            if [ -x node_modules/.bin/playwright ]; then
              node_modules/.bin/playwright --version || true
            else
              echo "playwright: not installed"
            fi
            ffmpeg -version 2>/dev/null | head -n 1 || true
            echo
            echo "## Artifact files"
            find artifacts -maxdepth 2 -type f -print 2>/dev/null | sort || true
            echo
            echo "## Largest workspace files"
            find "${GITHUB_WORKSPACE}" -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 40 || true
            echo
            echo "## Top memory processes"
            ps -eo pid,ppid,pcpu,pmem,comm --sort=-pmem 2>/dev/null | head -n 25 || true
          } | tee artifacts/runner-diagnostics.txt
          {
            echo "## Runner diagnostics"
            echo
            echo "- Generated: $(date -Iseconds)"
            echo "- Disk:"
            df -h "${GITHUB_WORKSPACE}" /tmp 2>/dev/null | sed 's/^/  /' || true
            echo "- Git:"
            git status --short 2>/dev/null | sed 's/^/  /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug artifacts
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.save_artifacts == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: arabnews-debug
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean runner workspace
        if: always()
        run: |
          echo "Disk before cleanup:"
          df -h .
          rm -rf node_modules artifacts
          find rendered-clips -type f -delete 2>/dev/null || true
          find rendered-clips -type d -empty -delete 2>/dev/null || true
          find archive/latest -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' -o -name '*.gif' \) -delete 2>/dev/null || true
          git gc --prune=now || true
          echo "Disk after cleanup:"
          df -h .
